<ion-header>
  <ion-toolbar color="wms">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/picking-tasks"></ion-back-button>
    </ion-buttons>
    <ion-title>Armazenar Picking</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-grid>
    <ion-row>
      <ion-col>
        <ion-icon name="open-outline"></ion-icon> Tarefa #{{ task?.Id }}
      </ion-col>
    </ion-row>
    <ion-row>
      <ion-col>
        <h6 class="title-list">{{ task?.TaskList?.OrderOwnerName }}</h6>
      </ion-col>
    </ion-row>
    <ion-row>
      <ion-col size="6" style="text-align: center;">
        <p class="text-list-item">{{ task?.LocalOriginForecastAddressFormated }}</p>
      </ion-col>
      <ion-col size="2">
        <div class="bg-arrow"></div>
      </ion-col>
      <ion-col size="4">
        <p class="text-list-item">{{ task?.LocalDestinationForecastAddressFormated }}</p>
      </ion-col>
    </ion-row>
    <ion-row>
      <ion-col>
        <p class="text-list-item text-wms">{{ task?.ProductDescription }}</p>
        <p class="text-list-item">Qtd.: {{ task?.QuantityOriginForecast }}</p>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>

<ion-footer>
  <ion-grid>
    <ion-row class="bg-wms" style="padding: 8px;">
      <ion-col style="padding: 8px;">
        <ion-item class="bg-wms">
          <ion-input
            type="text"
            [(ngModel)]="localIdentifier"
            autofocus="true"
            #identifier
            (ionChange)="onChangeIdentifier()"
            (ionBlur)="checkBlur()"
            [readonly]="isReadonly"
            class="bg-white"
            placeholder="Local">
          </ion-input>
        </ion-item>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-footer>
