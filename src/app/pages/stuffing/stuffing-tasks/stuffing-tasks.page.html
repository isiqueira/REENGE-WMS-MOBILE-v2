<ion-header>
  <ion-toolbar color="wms">
    <ion-buttons slot="start">
      <ion-back-button (click)="goBack()"></ion-back-button>
    </ion-buttons>
    <ion-title>Tarefas de Estufagem</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-searchbar
    [(ngModel)]="searchTerm"
    (ionInput)="filterList($event)"
    placeholder="Buscar por produto...">
  </ion-searchbar>

  <ion-list>
    <ion-item *ngFor="let item of stuffingTasksList">
      <ion-label>
        <h2>{{ item.ProductDescription }}</h2>
        <p>{{ item.LocationAddressFormated }}</p>
        <p>Conferidos: {{ item.Total }}</p>
      </ion-label>
      <ion-button slot="end" color="primary" (click)="goToStuffingConference(item)">
        Conferir
      </ion-button>
      <ion-button slot="end" color="success" (click)="conclude(item)">
        Concluir
      </ion-button>
    </ion-item>
  </ion-list>
</ion-content>
