<ion-header>
  <ion-toolbar color="wms">
    <ion-title>Estufagem</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-searchbar
    [(ngModel)]="searchTerm"
    (ionInput)="filterList($event)"
    placeholder="Buscar por código...">
  </ion-searchbar>

  <ion-list>
    <ion-item
      *ngFor="let item of stuffingList"
      button
      (click)="showPromptLocal(item)">
      <ion-label>
        <h2>{{ item.OrderCode }}</h2>
        <p>{{ item.OrderLocationAddressFormated }}</p>
      </ion-label>
    </ion-item>
  </ion-list>
</ion-content>
