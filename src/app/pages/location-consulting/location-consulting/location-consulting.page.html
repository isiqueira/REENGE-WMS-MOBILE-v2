<ion-header>
  <ion-toolbar color="wms">
    <ion-buttons slot="start">
      <ion-back-button></ion-back-button>
    </ion-buttons>
    <ion-title>Consulta de Local</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content *ngIf="fieldsVisible">

  <ion-grid>
    <ion-row padding class="bg-wmsmono text-white">
      <ion-col class="ion-text-center">
        <ion-icon name="location" color="white"></ion-icon><br>
        {{location?.Address}}
      </ion-col>
    </ion-row>
  </ion-grid>

  <ion-card>
    <ion-card-header>
      <ion-card-title>Detalhes</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <ion-list>
        <ion-item>
          <ion-label position="stacked" color="dark">Tipo</ion-label>
          <ion-input type="text" readonly [value]="location?.TypeDescription"></ion-input>
        </ion-item>
        <ion-item>
          <ion-label position="stacked" color="dark">Tipo do Apartamento</ion-label>
          <ion-input type="text" readonly [value]="location?.ApartmentTypeDescription"></ion-input>
        </ion-item>
      </ion-list>
    </ion-card-content>
  </ion-card>

  <ion-card *ngIf="stocks && stocks.length > 0">
    <ion-card-header>
      <ion-card-title>Estoque</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <ion-list>
        <ion-item *ngFor="let stock of stocks; let even = even" [color]="even ? 'white' : 'light'">
          <ion-label>
            <h2>{{stock.ProductDescription}}</h2>
            <p>Qtd: {{stock.Quantity}} | {{stock.Grouper}}</p>
          </ion-label>
        </ion-item>
      </ion-list>
    </ion-card-content>
  </ion-card>

  <ion-card *ngIf="seals && seals.length > 0">
    <ion-card-header>
      <ion-card-title>Paletes</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <ion-list>
        <ion-item *ngFor="let seal of seals; let even = even" [color]="even ? 'white' : 'light'">
          <ion-label>
            <h2>{{seal.Identifier}}</h2>
            <p>{{seal.Grouper}}</p>
          </ion-label>
        </ion-item>
      </ion-list>
    </ion-card-content>
  </ion-card>

</ion-content>
