<ion-header>
  <ion-toolbar color="wms">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/dash"></ion-back-button>
    </ion-buttons>
    <ion-title>Configurações</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-grid>
    <ion-row>
      <ion-col size="12">
        <span class="title-lighter">Local de Picking</span>
      </ion-col>
    </ion-row>

    <ion-row>
      <ion-col size="6" class="ion-align-self-center">
        {{configService.pickingLocation.Location}}
      </ion-col>
      <ion-col size="3" class="ion-align-self-center">
        <ion-button icon-only fill="outline" size="small" (click)="showPromptLocation(ACTION_PICKING)">
          <ion-icon name="pin"></ion-icon>
        </ion-button>
      </ion-col>
      <ion-col size="3" class="ion-align-self-center">
        <ion-button icon-only fill="outline" size="small" color="danger" (click)="resetLocation(ACTION_PICKING)">
          <ion-icon name="trash"></ion-icon>
        </ion-button>
      </ion-col>
    </ion-row>

    <ion-row>
      <ion-col>
        <ion-label>Picking Automático?</ion-label>
        <ion-toggle
          [(ngModel)]="configService.autoPicking"
          [checked]="configService.autoPicking"
          (ionChange)="onChangeToggle(ACTION_PICKING)">
        </ion-toggle>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
