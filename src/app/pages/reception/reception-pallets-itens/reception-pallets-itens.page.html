<ion-header>
  <ion-toolbar color="wms">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/reception-pallets"></ion-back-button>
    </ion-buttons>
    <ion-title>Itens</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>

  <ion-fab slot="fixed" vertical="bottom" horizontal="end">
    <ion-fab-button size="small" (click)="goCreatePalletItem()">
      <ion-icon name="add"></ion-icon>
    </ion-fab-button>
  </ion-fab>

  <ion-searchbar
    placeholder="Filtrar"
    (ionInput)="getItems($event)"
    [(ngModel)]="isearchBar"
    #searchBar>
  </ion-searchbar>

  <ion-row *ngIf="receptionPalletsItensList && receptionPalletsItensList.length > 0" class="text-dark">
    <ion-col size="12" class="ion-padding-start">
      <h4 class="title-lighter">Total de Itens: {{ receptionPalletsItensList?.length }}</h4>
    </ion-col>
  </ion-row>

  <ga-empty [show]="receptionPalletsItensList?.length == 0"></ga-empty>

  <ion-list lines="none">
    <ion-item-sliding *ngFor="let item of receptionPalletsItensList; let even = even">

      <ion-item [color]="even ? 'white' : 'light'">
        <ion-label>
          <p>
            <ion-icon name="pricetag-outline" color="dark"></ion-icon>
            <span class="text-dark">{{ item.Identifier }}</span>
          </p>
          <p>
            <ion-icon name="cube-outline" color="wms"></ion-icon>
            <span class="text-wms">{{ item.ProductDescription }}</span>
          </p>
          <ion-grid class="indicator ion-no-padding">
            <ion-row>
              <ion-col>
                <label>Quantidade</label>
                <span>{{ item.Quantity }}</span>
              </ion-col>
              <ion-col>
                <label>Local Atual</label>
                <span>{{ item.LocationAddress }}</span>
              </ion-col>
              <ion-col>
                <label>Imprimiu</label>
                <span>{{ item.Printed ? 'Sim' : 'Não' }}</span>
              </ion-col>
            </ion-row>
          </ion-grid>
        </ion-label>
      </ion-item>

      <ion-item-options side="start">
        <ion-item-option color="primary" (click)="print(item)">
          <ion-icon slot="start" name="print-outline"></ion-icon>
          Imprimir
        </ion-item-option>
      </ion-item-options>

    </ion-item-sliding>
  </ion-list>

</ion-content>
