<ion-header>
  <ion-toolbar color="wms">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/dash"></ion-back-button>
    </ion-buttons>
    <ion-title>Recebimento</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>

  <ion-searchbar
    placeholder="Filtrar"
    (ionInput)="getItems($event)"
    [(ngModel)]="isearchBar"
    #searchBar>
  </ion-searchbar>

  <ion-row *ngIf="receptionList && receptionList.length > 0" class="text-dark">
    <ion-col size="12" class="ion-padding-start ion-no-padding-bottom">
      <h4 class="title-lighter">Total de Ordens: {{ receptionList?.length }}</h4>
    </ion-col>
  </ion-row>

  <ga-empty [show]="receptionList?.length == 0"></ga-empty>

  <ion-list lines="none">
    <ion-item-sliding *ngFor="let item of receptionList; let even = even">

      <ion-item [color]="even ? 'white' : 'light'" (click)="goNfes(item)" button detail="false">
        <ion-label>
          <p>
            <ion-icon name="open-outline"></ion-icon>
            Ordem #{{ item.Code }}
          </p>
          <h2 class="title-list">{{ item.OwnerName }}</h2>
          <ion-grid class="indicator ion-no-padding">
            <ion-row>
              <ion-col>
                <label>Id. Ordem</label>
                <span>{{ item.Id }}</span>
              </ion-col>
              <ion-col>
                <label>Local</label>
                <span>{{ item.LocationAddress }}</span>
              </ion-col>
              <ion-col>
                <label>Status</label>
                <span>{{ item.StatusDescription }}</span>
              </ion-col>
            </ion-row>
          </ion-grid>
        </ion-label>
      </ion-item>

      <ion-item-options side="start">
        <ion-item-option color="success" (click)="conclude(item)">
          <ion-icon slot="start" name="checkmark-circle-outline"></ion-icon>
          Armazenar
        </ion-item-option>
      </ion-item-options>

    </ion-item-sliding>
  </ion-list>

</ion-content>
