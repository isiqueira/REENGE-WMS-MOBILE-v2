<ion-header>
  <ion-toolbar color="wms">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/reception"></ion-back-button>
    </ion-buttons>
    <ion-title>Recebimento NFe's</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>

  <ion-searchbar
    placeholder="Filtrar"
    (ionInput)="getItems($event)"
    [(ngModel)]="isearchBar"
    #searchBar>
  </ion-searchbar>

  <ion-row *ngIf="nfesList && nfesList.length > 0" class="text-dark">
    <ion-col size="12" class="ion-padding-start">
      <h4 class="title-lighter">Total de NFe's: {{ nfesList?.length }}</h4>
    </ion-col>
  </ion-row>

  <ga-empty [show]="nfesList?.length == 0"></ga-empty>

  <ion-list lines="none">
    <ion-item-sliding *ngFor="let item of nfesList; let even = even">

      <ion-item
        [color]="even ? 'white' : 'light'"
        (click)="goPallets(item)"
        button
        detail="false"
        [class.border-in-list]="
          ((item.QuantityItemsReal >= item.QuantityItems) && AllowControlFiscal) ||
          ((item.QuantityItemsReal >= item.QuantityVolume) && !AllowControlFiscal)"
        [class.border-danger]="
          (item.QuantityItemsReal > item.QuantityItems && AllowControlFiscal) ||
          (item.QuantityItemsReal > item.QuantityVolume && !AllowControlFiscal)"
        [class.border-success]="
          (item.QuantityItemsReal == item.QuantityItems && AllowControlFiscal) ||
          (item.QuantityItemsReal == item.QuantityVolume && !AllowControlFiscal)">

        <ion-label>
          <p>
            <ion-icon name="open-outline"></ion-icon>
            NFe #{{ item.NfNumber }}
            <ion-icon
              name="warning-outline"
              color="danger"
              *ngIf="(item.QuantityItemsReal > item.QuantityItems && AllowControlFiscal) ||
                     (item.QuantityItemsReal > item.QuantityVolume && !AllowControlFiscal)">
            </ion-icon>
            <ion-icon
              name="checkmark-outline"
              color="secondary"
              *ngIf="(item.QuantityItemsReal == item.QuantityItems && AllowControlFiscal) ||
                     (item.QuantityItemsReal == item.QuantityVolume && !AllowControlFiscal)">
            </ion-icon>
          </p>
          <h2 class="title-list">Agrupador: {{ item.Grouper }}</h2>
          <ion-grid class="indicator ion-no-padding">
            <ion-row>
              <ion-col>
                <label>Qtd. Prevista</label>
                <span *ngIf="AllowControlFiscal">{{ item.QuantityItems }}</span>
                <span *ngIf="!AllowControlFiscal">{{ item.QuantityVolume }}</span>
              </ion-col>
              <ion-col>
                <label>Qtd. Recebida</label>
                <span>{{ item.QuantityItemsReal }}</span>
              </ion-col>
            </ion-row>
          </ion-grid>
          <ion-row
            *ngIf="(item.QuantityItemsReal > item.QuantityItems && AllowControlFiscal) ||
                   (item.QuantityItemsReal > item.QuantityVolume && !AllowControlFiscal)">
            <ion-col class="ion-text-center ion-no-padding">
              <small class="text-danger">Quantidade excedida</small>
            </ion-col>
          </ion-row>
        </ion-label>

      </ion-item>

      <ion-item-options side="start">
        <ion-item-option color="success" (click)="conclude(item)">
          <ion-icon slot="start" name="checkmark-circle-outline"></ion-icon>
          Armazenar
        </ion-item-option>
        <ion-item-option color="primary" (click)="print(item)">
          <ion-icon slot="start" name="print-outline"></ion-icon>
          Imprimir
        </ion-item-option>
      </ion-item-options>

    </ion-item-sliding>
  </ion-list>

</ion-content>
