<ion-header>
  <ion-toolbar color="wms">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/storage-tasks"></ion-back-button>
    </ion-buttons>
    <ion-title>Armazenamento</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-row *ngIf="task">
    <ion-col>
      <h4 class="title-lighter">Tarefa #{{ task.Id }}</h4>
      <p>Selo: <strong>{{ task.SealIdentifier }}</strong></p>
    </ion-col>
  </ion-row>
</ion-content>
